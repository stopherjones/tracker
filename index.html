<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "chrono-node": "https://esm.sh/chrono-node@2"
    }
  }
  </script>
</head>
<body>
  <main>
    <form id="entry-form" autocomplete="off">
      <input
        id="entry-input"
        type="text"
        placeholder="Long walk yesterday 5pm m:4 @walk #outdoors"
        autofocus
        enterkeyhint="done"
      >
      <div id="suggestions" class="suggestions"></div>
      <p id="error" class="error" hidden></p>
    </form>

    <section id="feed"></section>
    <div class="no-print export-row">
      <button id="export-week" type="button">Export last 7 days</button>
      <button id="export-backup" type="button">Backup data</button>
      <button id="import-backup" type="button">Restore backup</button>
      <p id="backup-status" class="backup-status"></p>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
